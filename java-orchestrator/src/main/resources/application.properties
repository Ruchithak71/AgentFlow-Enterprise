# =============================================================
# AgentFlow Spring Boot — application.properties
# All environment-specific values are externalised via ${VAR:default}
# so they can be overridden cleanly by docker-compose or CI/CD.
# =============================================================

server.port=8081

# ---- DataSource (PostgreSQL) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/agentflow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agentflow_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agentflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# FIX A-5: 'validate' is safe for production — schema is managed by Flyway (below).
# Use 'create-drop' locally only by passing SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# ---- Flyway — Versioned Schema Migrations ----
# FIX C-6: Flyway owns the DDL. Migration scripts live in db/migration/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# FIX: The postgres schema was previously created by ddl-auto=update (no Flyway history table).
# baseline-on-migrate lets Flyway adopt the existing schema and track V1+ migrations going forward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- RabbitMQ ----
# FIX C-4: Host externalised — defaults to 'rabbitmq' (docker-compose service name).
# The old hardcoded 'agentflow-rabbitmq' caused DNS resolution failures.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ---- Redis ----
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ---- Spring Security (in-memory user for actuator/admin endpoints) ----
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# ---- Actuator & Prometheus ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
# FIX A-10: Correct Spring Boot 3.x Prometheus metrics key (deprecated key removed)
management.prometheus.metrics.export.enabled=true
