name: AgentFlow Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-java:
    name: Build Java Orchestrator
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Java Spring Boot App
      run: |
        cd java-orchestrator
        mvn clean package -DskipTests

  test-python:
    name: Test Python AI Worker
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Run Tests
      run: |
        cd python-ai-worker
        python -m pip install --upgrade pip
        pip install pytest tenacity pika redis google-generativeai
        pytest test_worker.py